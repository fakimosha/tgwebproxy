
name: Build tgwebproxy for Netcraze NC-1812

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go mod download
          go build -trimpath -ldflags="-s -w" \
            -o tgwebproxy-nc1812 ./cmd/tgwebproxy

      - name: Verify binary
        run: |
          file tgwebproxy-nc1812
          sha256sum tgwebproxy-nc1812
          ls -lh tgwebproxy-nc1812

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tgwebproxy-nc1812
          path: tgwebproxy-nc1812
          retention-days: 30
